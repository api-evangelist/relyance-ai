name: Relyance Ai
description: >-
  Relyance AI is an AI-native data security, AI security, and privacy platform that maps data flows from
  source code through cloud and SaaS systems to AI models. Its core product, Lyo, acts as a "data defense
  engineer" providing real-time visibility into where sensitive data lives and moves, who accesses it, and
  how to remediate risk. The platform unifies data security (sensitive-data discovery, classification, and
  exfiltration detection), AI security (AI agent inventory, MCP server discovery, agentic AI risk), and
  privacy automation (DSRs, ROPAs, DPIAs, and consent management). Relyance AI is backed by Menlo Ventures.
